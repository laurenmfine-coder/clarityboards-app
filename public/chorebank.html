<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2C7A68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chore Bank">
<title>Chore Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --sunk:#E3EBE8; --line:#D3DEDA;
  --ink:#12312B; --muted:#5B726D;
  --accent:#2C7A68; --accent-ink:#FFFFFF; --accent-soft:#D6EBE4;
  --coin:#B47A0C; --coin-soft:#FBEFD2;
  --pending:#5A6CC8; --pending-soft:#E3E7FA;
  --back:#C2503A; --back-soft:#FBE3DD;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1916; --surface:#16241F; --sunk:#1D2E29; --line:#2A3F39;
  --ink:#E4EFEB; --muted:#94AAA4;
  --accent:#4DB598; --accent-ink:#0B1A16; --accent-soft:#1E3C34;
  --coin:#F0BB48; --coin-soft:#3A3018;
  --pending:#8E9DF0; --pending-soft:#262C4A;
  --back:#EE7B63; --back-soft:#40231D;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(12px + env(safe-area-inset-top,0px)) 104px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:26px;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:17px;font-weight:700}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--sunk);padding:4px;border-radius:999px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.tab[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--pending);color:#fff;font-size:12px}
.card{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--coin)}
.big.neg{color:var(--back)}
.vault{background:linear-gradient(135deg,var(--coin-soft),var(--surface) 70%)}
.bar{height:16px;border-radius:999px;background:var(--sunk);overflow:hidden;display:flex}
.bar .a{background:var(--accent);transition:width .4s ease}
.bar .p{background:repeating-linear-gradient(45deg,var(--pending) 0 6px,var(--pending-soft) 6px 12px);transition:width .4s ease}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tot b{font-family:var(--display);font-size:24px;font-weight:700}
.tot input[type=date]{background:transparent;border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:13px;max-width:100%}
.pct{font-family:var(--display);font-weight:700;font-size:20px}
.grow{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.grow .dot{flex:none;width:28px;height:28px;border-radius:50%;background:var(--coin);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.ledger li:first-child{border-top:0}
.ledger .what{min-width:0;overflow-wrap:anywhere}
.ledger .amt{font-weight:600;white-space:nowrap}
.amt.plus{color:var(--accent)} .amt.minus{color:var(--back)} .amt.int{color:var(--coin)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day .wd{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.day .dn{font-family:var(--display);font-size:20px;font-weight:700;line-height:1}
.day .ct{font-size:11px;color:var(--muted)}
.day.today .dn{color:var(--accent)}
.day[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-current="true"] .wd,.day[aria-current="true"] .ct{color:var(--bg);opacity:.8}
.day.full .ct{color:var(--accent);font-weight:600}
.day[aria-current="true"].full .ct{color:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.check{flex:none;width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.check svg{width:20px;height:20px;opacity:0}
.s-done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.s-pending .check{background:var(--pending);border-color:var(--pending);color:#fff}
.s-approved .check{background:var(--coin);border-color:var(--coin);color:#fff}
.s-done .check svg,.s-pending .check svg,.s-approved .check svg{opacity:1}
.s-returned .check{border-color:var(--back)}
.check:disabled{cursor:default}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-weight:500;overflow-wrap:anywhere}
.val{font-weight:600;color:var(--coin);white-space:nowrap}
.row-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.pending{background:var(--pending-soft);color:var(--pending)}
.pill.approved{background:var(--coin-soft);color:var(--coin)}
.pill.returned{background:var(--back-soft);color:var(--back)}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:500;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.link.danger{color:var(--back)}
.reply{margin:0;font-size:13px;background:var(--back-soft);padding:6px 10px;border-radius:8px}
.note-text{margin:0;font-size:13px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
textarea,input[type=text],input[type=number],input[type=password],input[type=date],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{min-height:56px;resize:vertical}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.addform{display:grid;grid-template-columns:1fr 96px auto;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.warn{background:var(--back);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.dashed{border:2px dashed var(--line);background:transparent;border-radius:12px;padding:10px;color:var(--muted);font-weight:600;width:100%}
.empty{color:var(--muted);font-size:14px;padding:8px 0;margin:0}
.sendbar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.sendbar .btn{display:block;width:100%;max-width:680px;margin:0 auto;padding:14px;font-size:16px;border-radius:14px}
.prow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.prow:first-child{border-top:0}
.prow .info{flex:1 1 200px;min-width:0}
.prow .acts{display:flex;gap:8px;flex-wrap:wrap}
.chore-ed{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.chore-ed:first-child{border-top:0}
.chore-ed .line{display:grid;grid-template-columns:1fr 100px;gap:8px}
.dtog{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.dtog button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
.dtog button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.anyt{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.chip b{color:var(--coin);font-weight:600}
.chip:active{transform:scale(.97)}
.kindsel{width:auto;padding:4px 8px;font-size:13px}
.dtog .link{width:auto;height:auto;border:0;background:none;color:var(--back);font-size:13px}
.addform.rate{grid-template-columns:1fr 1.4fr auto}
.money-in{position:relative}
.money-in span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.money-in input{padding-left:22px}
.kidsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kidsum .tot b{color:var(--coin)}
.pin{display:flex;gap:8px;max-width:340px}
.notice{background:var(--pending-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:0}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:22px 12px;font-family:var(--display);font-size:22px;font-weight:700}
.who button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
@media (max-width:420px){.big{font-size:38px}.days{gap:4px}.day .dn{font-size:18px}.addform{grid-template-columns:1fr 84px}.addform .btn{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -4px;padding:0 4px}
.subtabs::-webkit-scrollbar{display:none}
.subtab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.subtab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.fam{font-size:13px;color:var(--muted);font-weight:500}
.spark{width:100%;height:auto;display:block}
.spark .ln{fill:none;stroke-width:2}
.spark .up{stroke:var(--accent)} .spark .dn{stroke:var(--back)}
.spark .ar.up{fill:var(--accent-soft);stroke:none} .spark .ar.dn{fill:var(--back-soft);stroke:none}
.spark text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.ranges{display:flex;gap:6px;flex-wrap:wrap}
.ranges button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.ranges button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{display:flex;flex-direction:column;gap:8px}
.cat h3{font-size:15px}
.tkr{font-family:var(--display);font-weight:700;letter-spacing:.02em}
.gain{font-weight:600} .gain.up{color:var(--accent)} .gain.dn{color:var(--back)}
.hold{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.hold:first-child{border-top:0}
.hold .l{min-width:0}
.whatif{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.whatif .res{font-family:var(--display);font-size:22px;font-weight:700}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline > *{flex:1 1 120px;min-width:0}
.kindtag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pretend{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:6px 10px;margin:0}
.req{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.req:first-child{border-top:0}
.pill.open{background:var(--pending-soft);color:var(--pending)}
.pill.declined,.pill.cancelled{background:var(--sunk);color:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statrow .tot b{font-size:20px}
.check-in{display:flex;gap:8px;align-items:center;font-size:14px}
.check-in input{width:auto}
.welcome{display:flex;flex-direction:column;gap:16px;max-width:520px}
.hero{padding-block:12px}
.hero h1{font-size:34px}
.hero p{color:var(--muted);margin:6px 0 0}
.kidrows{display:flex;flex-direction:column;gap:8px}
@media (max-width:420px){.statrow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Opening…</p></div>
<div class="sendbar" id="sendbar" hidden></div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DL=['S','M','T','W','T','F','S'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ALL=[0,1,2,3,4,5,6];
const P=s=>new Date(s+'T00:00:00Z');
const F=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=P(s);d.setUTCDate(d.getUTCDate()+n);return F(d)};
const addYears=(s,n)=>{const d=P(s);d.setUTCFullYear(d.getUTCFullYear()+n);return F(d)};
const addMonths=(s,n)=>{const d=P(s);d.setUTCMonth(d.getUTCMonth()+n);return F(d)};
const sundayOf=s=>addDays(s,-P(s).getUTCDay());
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const money=v=>{const n=Math.round(num(v)*100)/100;return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const pct=v=>(v>=0?'+':'')+(Math.round(v*10)/10).toFixed(1)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=s=>{const d=P(s);return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}`};
const niceY=s=>{const d=P(s);return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`};
const longDay=s=>{const d=P(s);return `${WD[d.getUTCDay()]}, ${MON[d.getUTCMonth()]} ${d.getUTCDate()}`};
const nextBoundary=(d,p)=>{if(p==='week'){const w=P(d).getUTCDay();return addDays(d,w===0?7:7-w)}const x=P(d);return F(new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,1)))};
const sign=e=>e.type==='withdrawal'?-1:1;

/* ---------- investment catalog ---------- */
const KIND={stock:'Stock',fund:'Fund',mutual:'Mutual fund',bond:'Bond fund'};
const KIND_HELP={stock:'A stock is a tiny piece of one company. If the company grows, your piece is worth more.',fund:'A fund is a basket of many companies bought all at once, so one bad company hurts less.',mutual:'A mutual fund is a basket of companies, priced once a day after the market closes.',bond:'A bond is a loan to a government or company. It pays interest and usually moves more slowly than stocks.'};
const CATALOG=[
 ['AAPL','stock','Apple','Makes iPhones, iPads and Macs.'],['MSFT','stock','Microsoft','Windows, Xbox and cloud computing.'],
 ['NVDA','stock','Nvidia','Chips that power video games and AI.'],['AMZN','stock','Amazon','Online shopping and cloud services.'],
 ['GOOGL','stock','Alphabet','Google search, YouTube and Android.'],['DIS','stock','Disney','Movies, theme parks and Disney+.'],
 ['NKE','stock','Nike','Sneakers and sportswear.'],['NFLX','stock','Netflix','Streaming shows and movies.'],
 ['TSLA','stock','Tesla','Electric cars and batteries.'],['MCD','stock',"McDonald's",'Restaurants all over the world.'],
 ['KO','stock','Coca-Cola','Drinks sold in about 200 countries.'],['RBLX','stock','Roblox','The online game platform.'],
 ['VOO','fund','Vanguard S&P 500','The 500 biggest US companies in one fund.'],['VTI','fund','Vanguard Total Stock Market','Almost every company in the US.'],
 ['QQQ','fund','Invesco QQQ','100 big companies, heavy on tech.'],['VXUS','fund','Vanguard Total International','Companies outside the US.'],
 ['SCHD','fund','Schwab US Dividend','Companies that pay steady dividends.'],
 ['VFIAX','mutual','Vanguard 500 Index Admiral','The S&P 500 as a mutual fund.'],['FXAIX','mutual','Fidelity 500 Index','Fidelity’s S&P 500 mutual fund.'],
 ['BND','bond','Vanguard Total Bond Market','Loans to the US government and big companies.'],['SHY','bond','iShares 1-3 Year Treasury','Short loans to the US government. Steady and slow.'],
 ['TIP','bond','iShares TIPS','Government bonds that keep up with inflation.'],
];
const catOf=s=>CATALOG.find(c=>c[0]===s);

/* ---------- session ---------- */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let token=store.get('cb_token');let famCode=store.get('cb_code');
let S=null;let hello=null;
const PX={};
const ui={top:null,sub:'chores',week:null,day:null,openNotes:{},addExtra:false,sendBack:{},confirm:null,pickWho:null,showAll:false,busy:false,sym:null,range:'1y',welcome:'code',kidRows:2};
const drafts={};

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
async function call(body,auth=true){
  const res=await fetch('/api/chores',{method:'POST',headers:{'Content-Type':'application/json',...(auth&&token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});
  let data={};try{data=await res.json()}catch(e){}
  if(res.status===401&&auth){token=null;store.set('cb_token',null);S=null;await boot();throw new Error(data.error||'Please log in again.')}
  if(!res.ok)throw new Error(data.error||'Something went wrong. Try again.');
  return data;
}
async function act(body){
  if(ui.busy)return false;ui.busy=true;
  try{const d=await call(body);setState(d.state);return true}catch(e){toast(e.message);return false}finally{ui.busy=false}
}
function setState(st){
  S=st;
  if(S.family&&S.family.code&&S.family.code!==famCode){famCode=S.family.code;store.set('cb_code',famCode)}
  if(!ui.week){ui.week=sundayOf(S.today);ui.day=S.today}
  if(S.who!=='parent')ui.top=S.who;
  else if(!ui.top||(ui.top!=='home'&&ui.top!=='settings'&&!kid(ui.top)))ui.top='home';
  render();
  if(ui.sub==='invest'&&viewKid())loadPrices(neededSyms());
}
async function loadPrices(syms){
  const need=syms.filter(s=>s&&(!PX[s]||Date.now()-PX[s].got>15*60e3));
  if(!need.length)return;
  for(const s of need)PX[s]=Object.assign(PX[s]||{},{loading:true});
  try{const d=await call({action:'prices',symbols:need});for(const s of need){PX[s]=d.prices[s]?Object.assign(d.prices[s],{got:Date.now()}):{missing:true,got:Date.now()}}}
  catch(e){for(const s of need)PX[s]={missing:true,got:0};}
  render();
}

/* ---------- derived ---------- */
const byOrder=(a,b)=>(num(a.order)-num(b.order))||String(a.name).localeCompare(String(b.name));
const kid=id=>S.kids.find(k=>k.id===id);
const viewKid=()=>ui.top&&ui.top!=='home'&&ui.top!=='settings'?ui.top:null;
const isParent=()=>S&&S.who==='parent';
const wk=(k,ws)=>S.weeks[k+'_'+ws];
const choresFor=k=>S.chores.filter(c=>c.kidId===k&&c.active!==false).sort(byOrder);
const anytimeFor=k=>choresFor(k).filter(c=>c.kind==='anytime');
const scheduled=(k,date)=>{const wd=P(date).getUTCDay();return choresFor(k).filter(c=>c.kind!=='anytime'&&(Array.isArray(c.days)?c.days:ALL).includes(wd))};
const itemOf=(k,date,cid)=>wk(k,sundayOf(date))?.days?.[date]?.[cid];
const extrasFor=(k,date)=>Object.entries(wk(k,sundayOf(date))?.extras||{}).map(([eid,e])=>({eid,...e})).filter(e=>e.date===date&&e.status!=='deleted').sort((a,b)=>num(a.at)-num(b.at));
function allItems(w){const out=[];for(const [date,m] of Object.entries(w.days||{}))for(const [cid,it] of Object.entries(m||{}))out.push({...it,date,cid});for(const [eid,e] of Object.entries(w.extras||{}))if(e.status!=='deleted')out.push({...e,eid,extra:true});return out}
const liveVal=it=>{if(it.cid&&(it.status==='done'||it.status==='returned')){const c=S.chores.find(c=>c.id===it.cid);if(c)return num(c.value)}return num(it.value)};
function weekStats(k,ws){
  let potential=0;for(let i=0;i<7;i++)potential+=scheduled(k,addDays(ws,i)).reduce((a,c)=>a+num(c.value),0);
  let earned=0,pending=0,ready=0,readyN=0;const w=wk(k,ws);
  if(w)for(const it of allItems(w)){const v=liveVal(it);if(it.extra)potential+=num(it.value);if(it.status==='approved')earned+=v;else if(it.status==='pending')pending+=v;else if(it.status==='done'){ready+=v;readyN++}}
  return {potential,earned,pending,ready,readyN};
}
const ledger=k=>(S.ledgers[k]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)||num(b.at)-num(a.at));
const balance=k=>(S.ledgers[k]||[]).reduce((a,e)=>a+sign(e)*num(e.amount),0);
const earnedBetween=(k,from,to)=>(S.ledgers[k]||[]).filter(e=>e.type==='earned'&&e.date>=from&&(!to||e.date<=to)).reduce((a,e)=>a+num(e.amount),0);
const interestTotal=k=>(S.ledgers[k]||[]).filter(e=>e.type==='interest').reduce((a,e)=>a+num(e.amount),0);
function pendingAll(){const out=[];for(const w of Object.values(S.weeks))for(const it of allItems(w))if(it.status==='pending')out.push({...it,kidId:w.kidId});return out.sort((a,b)=>a.date.localeCompare(b.date))}
const dval=(k,f)=>k in drafts?drafts[k]:(f??'');
const invOf=k=>S.inv[k]||{cash:0,granted:0,holdings:{},trades:[]};
function portfolio(k){
  const inv=invOf(k);let value=0,known=true;
  for(const [s,h] of Object.entries(inv.holdings)){const p=PX[s];if(p&&p.price)value+=h.shares*p.price;else{known=false;value+=h.cost}}
  return {cash:inv.cash,value,total:inv.cash+value,granted:inv.granted,known};
}
function neededSyms(){const k=viewKid();const s=new Set(Object.keys(k?invOf(k).holdings:{}));if(ui.sym)s.add(ui.sym);for(const r of S.requests)if(r.status==='open')s.add(r.symbol);return [...s]}
function closeOnOrAfter(rows,date){for(const r of rows)if(r[0]>=date)return r;return null}
function changeSince(p,date){const r=closeOnOrAfter(p.rows,date);if(!r||r[0]>addDays(date,10))return null;return {from:r,ratio:p.price/r[1]}}
function rangeStart(r,t){return r==='1m'?addMonths(t,-1):r==='1y'?addYears(t,-1):r==='5y'?addYears(t,-5):addYears(t,-10)}

/* ----- chores ----- */
function weekCard(k){
  const K=kid(k);const ws=ui.week;const st=weekStats(k,ws);
  const p=st.potential?Math.round(st.earned/st.potential*100):0;
  const aW=st.potential?Math.min(100,st.earned/st.potential*100):0;
  const pW=st.potential?Math.min(100-aW,st.pending/st.potential*100):0;
  const yr=S.today.slice(0,4);const thisWeek=ws===sundayOf(S.today);
  return `<section class="card"><div class="head"><div><div class="eyebrow">${thisWeek?'Earned this week':'Earned week of '+nice(ws)}</div><div class="big num">${money(st.earned)}</div></div>
    <div style="text-align:right"><div class="pct num">${p}% of max</div><div class="muted small num">${money(st.potential)} possible</div></div></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}" aria-label="Percent of the most you can earn this week"><div class="a" style="width:${aW}%"></div><div class="p" style="width:${pW}%"></div></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Approved ${money(st.earned)}</span><span><i style="background:var(--pending)"></i>Waiting ${money(st.pending)}</span><span><i style="background:var(--sunk);outline:1px solid var(--line)"></i>Still possible ${money(Math.max(0,st.potential-st.earned-st.pending))}</span></div>
    <div class="totals"><div class="tot"><span class="eyebrow">Earned in ${yr}</span><b class="num">${money(earnedBetween(k,yr+'-01-01',yr+'-12-31'))}</b></div>
    <div class="tot"><label class="eyebrow" for="since-${esc(k)}">Earned since</label><input type="date" id="since-${esc(k)}" data-change="since" data-kid="${esc(k)}" value="${esc(K.since||'')}"><b class="num">${K.since?money(earnedBetween(k,K.since)):'<span class="muted small">Pick a date</span>'}</b></div></div></section>`;
}
function renderChores(k){
  const ws=ui.week;
  let h=weekCard(k);
  h+=`<div class="weeknav"><button class="icon-btn" data-act="week" data-d="-7" aria-label="Previous week">‹</button><h2 class="num">${nice(ws)} – ${nice(addDays(ws,6))}</h2><button class="icon-btn" data-act="week" data-d="7" aria-label="Next week">›</button></div><div class="days">`;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);const sch=scheduled(k,d);const ex=extrasFor(k,d);const total=sch.length+ex.length;
    const ok=s=>s&&s!=='none'&&s!=='returned';
    const n=sch.filter(c=>ok(itemOf(k,d,c.id)?.status)).length+ex.filter(e=>ok(e.status)).length;
    h+=`<button class="day${d===S.today?' today':''}${total&&n===total?' full':''}" data-act="day" data-d="${d}" aria-current="${ui.day===d}" aria-label="${longDay(d)}, ${n} of ${total} done"><span class="wd">${DAYS[i].toUpperCase()}</span><span class="dn num">${P(d).getUTCDate()}</span><span class="ct num">${total?n+'/'+total:'–'}</span></button>`;
  }
  h+=`</div>`;
  const d=ui.day;const sch=scheduled(k,d);const ex=extrasFor(k,d);
  h+=`<section class="panel"><h3>${longDay(d)}</h3>`;
  if(!sch.length)h+=`<p class="empty">No daily chores today. Log anytime chores below.</p>`;
  h+=`<ul class="list">`;
  for(const c of sch){const it=itemOf(k,d,c.id)||{};h+=rowHtml(k,d,{cid:c.id},c.name,(it.status==='approved'||it.status==='pending')?num(it.value):num(c.value),it,false)}
  h+=`</ul>`;
  const any=anytimeFor(k);
  h+=`<div class="sub"><span class="eyebrow">Anytime chores</span><span class="muted small">Tap each time you do one</span></div>`;
  if(any.length)h+=`<div class="anyt">${any.map(c=>`<button class="chip" data-act="logAny" data-id="${esc(c.id)}" data-kid="${esc(k)}" data-date="${d}">+ ${esc(c.name)} <b class="num">${money(c.value)}</b></button>`).join('')}</div>`;
  if(ex.length){h+=`<ul class="list">`;for(const e of ex)h+=rowHtml(k,d,{eid:e.eid},e.name,num(e.value),e,true);h+=`</ul>`}
  if(ui.addExtra)h+=`<form class="addform" data-form="extra" data-kid="${esc(k)}" data-date="${d}"><input type="text" id="x-name" data-draft="x-name" placeholder="What did you do?" value="${esc(dval('x-name'))}" aria-label="Extra chore"><div class="money-in"><span>$</span><input type="number" id="x-val" data-draft="x-val" min="0" step="0.25" inputmode="decimal" placeholder="0.00" value="${esc(dval('x-val'))}" aria-label="Amount"></div><button class="btn" type="submit">Add</button></form>`;
  else h+=`<button class="dashed" data-act="openExtra">+ Add something not on the list</button>`;
  h+=`</section>`;
  if(isParent())h+=choreEditor(k);
  return h;
}
function rowHtml(k,date,ref,name,value,it,isExtra){

/* ----- invest ----- */
function spark(p,range){
  const start=rangeStart(range,p.date);const rows=p.rows.filter(r=>r[0]>=start);
  if(rows.length<2)return '<p class="muted small">Not enough price history for this range.</p>';
  const W=300,H=110,pad=4,top=8,bottom=18;
  const vals=rows.map(r=>r[1]);const min=Math.min(...vals),max=Math.max(...vals);const span=max-min||1;
  const x=i=>pad+i*(W-2*pad)/(rows.length-1);const y=v=>top+(H-top-bottom)*(1-(v-min)/span);
  const d=rows.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(r[1]).toFixed(1)).join(' ');
  const up=vals[vals.length-1]>=vals[0];const c=up?'up':'dn';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price from ${niceY(rows[0][0])} to ${niceY(rows[rows.length-1][0])}"><path class="ar ${c}" d="${d} L${x(rows.length-1).toFixed(1)} ${H-bottom} L${x(0).toFixed(1)} ${H-bottom} Z" opacity=".6"/><path class="ln ${c}" d="${d}"/><text x="${pad}" y="${H-4}">${niceY(rows[0][0])}</text><text x="${W-pad}" y="${H-4}" text-anchor="end">${niceY(rows[rows.length-1][0])}</text></svg>`;
}

  return h;

function renderSymbol(k,s){

function renderSettings(){
  const kids=S.kids.slice().sort(byOrder);
  let h=`<section class="panel"><h2>Family code</h2><p class="muted small">Kids enter this once on their device, then pick their name and PIN.</p><div class="inline" style="flex-wrap:nowrap"><span class="tkr" style="font-size:28px;letter-spacing:.12em;flex:0 0 auto" id="famcode">${esc(S.family.code||'')}</span><button class="btn ghost" data-act="copyCode" style="flex:0 0 auto">Copy</button></div></section>`;
  h+=`<section class="panel"><h2>Family name</h2><div class="pin"><input type="text" id="fam-name" data-draft="fam-name" data-change="famName" value="${esc(dval('fam-name',S.family.name))}" aria-label="Family name"></div></section>`;
  h+=`<section class="panel"><h2>Kids and PINs</h2><div>`;
  for(const k of kids)h+=`<div class="chore-ed"><div class="grid2"><input type="text" id="kn-${esc(k.id)}" data-draft="kn-${esc(k.id)}" data-change="kidName" data-id="${esc(k.id)}" value="${esc(dval('kn-'+k.id,k.name))}" aria-label="Name"><form class="pin" data-form="kidpin" data-kid="${esc(k.id)}"><input type="password" id="kp-${esc(k.id)}" inputmode="numeric" autocomplete="new-password" placeholder="${k.hasPin?'New PIN':'Set a PIN'}" aria-label="${esc(k.name)} PIN"><button class="btn ${k.hasPin?'ghost':''}" type="submit">${k.hasPin?'Change':'Set'}</button></form></div>${k.hasPin?'':`<span class="muted small">No PIN yet, so ${esc(k.name)} can't log in.</span>`}</div>`;
  h+=`</div><form class="addform" data-form="kid" style="grid-template-columns:1fr auto"><input type="text" id="k-new" data-draft="k-new" placeholder="Add a kid" value="${esc(dval('k-new'))}" aria-label="New kid's name"><button class="btn" type="submit">Add</button></form></section>`;
  h+=`<section class="panel"><h2>Parent PIN</h2><form class="pin" data-form="parentpin"><input type="password" id="pp-new" inputmode="numeric" autocomplete="new-password" placeholder="New parent PIN" aria-label="New parent PIN"><button class="btn" type="submit">Change</button></form></section>`;
  return h;
}

function renderSendbar(){
  const bar=document.getElementById('sendbar');const k=S&&viewKid();
  if(!S||!k||ui.sub!=='chores'){bar.hidden=true;return}
  const st=weekStats(k,ui.week);bar.hidden=false;
  bar.innerHTML=`<button class="btn" data-act="send" ${st.readyN?'':'disabled'}>${st.readyN?`Send ${st.readyN} for approval · ${money(st.ready)}`:'Check off chores, then send for approval'}</button>`;
}

/* ---------- events ---------- */
const refOf=d=>d.cid?{cid:d.cid}:{eid:d.eid};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,d=b.dataset;
  switch(a){
    case 'welcome':ui.welcome=d.id;break;
    case 'moreKid':ui.kidRows=Math.min(12,ui.kidRows+1);break;
    case 'forgetCode':famCode=null;store.set('cb_code',null);hello={needCode:true};ui.pickWho=null;break;
    case 'pick':ui.pickWho=d.id;render();document.getElementById('login-pin')?.focus();return;
    case 'logout':token=null;store.set('cb_token',null);S=null;ui.top=null;ui.week=null;ui.pickWho=null;boot();return;
    case 'top':ui.top=d.id;ui.addExtra=false;ui.showAll=false;ui.confirm=null;ui.sym=null;if(viewKid()&&!['chores','bank','invest','reading','grades'].includes(ui.sub))ui.sub='chores';break;
    case 'sub':ui.sub=d.id;ui.showAll=false;ui.confirm=null;render();if(d.id==='invest')loadPrices(neededSyms());return;
    case 'week':ui.week=addDays(ui.week,num(d.d));ui.day=ui.week===sundayOf(S.today)?S.today:ui.week;ui.addExtra=false;break;
    case 'day':ui.day=d.d;ui.addExtra=false;break;
    case 'openExtra':ui.addExtra=true;render();document.getElementById('x-name')?.focus();return;
    case 'note':ui.openNotes[d.key]=true;render();return;
    case 'showAll':ui.showAll=!ui.showAll;break;
    case 'ask':ui.confirm=d.id;break;
    case 'toggle':return act({action:'toggle',kid:d.kid,date:d.date,...refOf(d)});
    case 'delExtra':return act({action:'delExtra',kid:d.kid,date:d.date,...refOf(d)});
    case 'logAny':{const c=S.chores.find(c=>c.id===d.id);act({action:'addExtra',kid:d.kid,date:d.date,preset:d.id}).then(ok=>ok&&c&&toast(`Logged: ${c.name}`));return}
    case 'send':{const k=viewKid();const st=weekStats(k,ui.week);act({action:'send',kid:k,ws:ui.week}).then(ok=>ok&&toast(`Sent ${st.readyN} for approval.`));return}
    case 'approve':return act({action:'approve',kid:d.kid,date:d.date,...refOf(d)});
    case 'approveAll':act({action:'approveAll',kid:d.kid}).then(ok=>ok&&toast('Approved. Added to the bank.'));return;
    case 'openBack':ui.sendBack[d.key]=true;break;
    case 'cancelBack':delete ui.sendBack[d.key];break;
    case 'dayTog':{const c=S.chores.find(c=>c.id===d.id);if(!c)return;const s=new Set(Array.isArray(c.days)?c.days:ALL);const i=num(d.i);s.has(i)?s.delete(i):s.add(i);return act({action:'updateChore',id:c.id,days:[...s]})}
    case 'removeChore':ui.confirm=null;return act({action:'updateChore',id:d.id,active:false});
    case 'addChore':return act({action:'addChore',kid:d.kid,kind:d.kind});
    case 'ledgerDel':ui.confirm=null;return act({action:'ledgerDelete',kid:d.kid,id:d.id});
    case 'pickSym':ui.sym=d.id;render();loadPrices([d.id]);document.querySelector('[aria-label$=" details"]')?.scrollIntoView({behavior:'smooth',block:'start'});return;
    case 'closeSym':ui.sym=null;break;
    case 'range':ui.range=d.id;break;
    case 'sell':case 'sellAll':{const amt=num(drafts['tr-amt']);const all=a==='sellAll'||!(amt>0);act({action:'sell',kid:d.kid,symbol:d.sym,amount:amt,all}).then(ok=>{if(ok){delete drafts['tr-amt'];toast(`Sold ${d.sym}.`);render()}});return}
    case 'resetPractice':ui.confirm=null;act({action:'resetPractice',kid:d.kid}).then(ok=>ok&&toast('Practice account started over.'));return;
    case 'cancelReq':return act({action:'cancelRequest',kid:d.kid,id:d.id});
    case 'delReading':ui.confirm=null;return act({action:'delReading',kid:d.kid,id:d.id});
    case 'delGrade':ui.confirm=null;return act({action:'delGrade',kid:d.kid,id:d.id});
    case 'copyCode':{const c=S.family.code;try{navigator.clipboard.writeText(c).then(()=>toast('Copied.'),()=>selectCode())}catch(err){selectCode()}return}
  }
  render();
});
function selectCode(){const el=document.getElementById('famcode');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Code selected. Copy it from here.')}
document.addEventListener('input',e=>{const t=e.target;const k=t.dataset?.draft;if(k!=null){drafts[k]=t.value;if(k==='in-rate'||k==='in-per'||t.dataset.live)render()}if(t.dataset?.check){drafts[t.dataset.check]=t.checked?'1':''}});
document.addEventListener('change',e=>{
  const t=e.target,c=t.dataset?.change;if(t.dataset?.check){drafts[t.dataset.check]=t.checked?'1':''}if(!c)return;const v=t.value;
  if(c==='note'){const key=t.dataset.draft;delete drafts[key];delete ui.openNotes[key];act({action:'note',kid:t.dataset.kid,date:t.dataset.date,...refOf(t.dataset),note:v})}
  else if(c==='since')act({action:'setSince',kid:t.dataset.kid,since:v});
  else if(c==='choreName'){delete drafts[t.dataset.draft];if(v.trim())act({action:'updateChore',id:t.dataset.id,name:v})}
  else if(c==='choreVal'){delete drafts[t.dataset.draft];act({action:'updateChore',id:t.dataset.id,value:num(v)})}
  else if(c==='choreKind')act({action:'updateChore',id:t.dataset.id,kind:v});
  else if(c==='kidName'){delete drafts[t.dataset.draft];if(v.trim())act({action:'renameKid',kid:t.dataset.id,name:v})}
  else if(c==='famName'){delete drafts[t.dataset.draft];if(v.trim())act({action:'renameFamily',name:v})}
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const kind=f.dataset.form,fd=f.dataset;const clear=(...ks)=>ks.forEach(k=>delete drafts[k]);
  try{
    if(kind==='code'){const code=(drafts['fam-code']||'').trim();if(!code){toast('Type the family code.');return}
      const h=await call({action:'hello',code},false);famCode=code.toUpperCase().replace(/[^A-Z0-9]/g,'');store.set('cb_code',famCode);hello=h;render();return}
    if(kind==='create'){
      const kids=[];for(let i=0;i<ui.kidRows;i++){const n=(drafts['nf-k'+i]||'').trim();if(n)kids.push(n)}
      const d=await call({action:'createFamily',familyName:drafts['nf-name']||'',kids,pin:document.getElementById('nf-pin').value.trim()},false);
      token=d.token;store.set('cb_token',token);famCode=d.code;store.set('cb_code',d.code);ui.top='settings';setState(d.state);toast('Family created. Set each kid’s PIN here.');return}
    if(kind==='login'){
      const pin=f.querySelector('input').value.trim();if(!pin){toast('Type the PIN first.');return}
      const d=await call({action:'login',code:famCode,who:ui.pickWho,pin},false);
      token=d.token;store.set('cb_token',token);setState(d.state);return}
    if(kind==='extra'){const name=(drafts['x-name']||'').trim();if(!name){toast('Type what you did first.');return}
      if(await act({action:'addExtra',kid:fd.kid,date:fd.date,name,value:num(drafts['x-val'])})){clear('x-name','x-val');ui.addExtra=false;render()}return}
    if(kind==='sendback'){const key=`${fd.kid}|${fd.date}|${fd.cid||fd.eid}`;if(await act({action:'sendBack',kid:fd.kid,date:fd.date,...refOf(fd),reply:drafts['sb|'+key]||''})){clear('sb|'+key);delete ui.sendBack[key];render()}return}
    if(kind==='ledger'){const amt=num(drafts['lg-amt']);if(!(amt>0)){toast('Enter an amount above $0.');return}
      if(await act({action:'ledgerAdd',kid:fd.kid,type:drafts['lg-type']||'deposit',amount:amt,note:drafts['lg-note']||'',date:drafts['lg-date']||S.today})){clear('lg-amt','lg-note','lg-date');render();toast('Saved to the bank.')}return}
    if(kind==='interest'){const K=kid(fd.kid);if(await act({action:'setInterest',kid:fd.kid,rate:num(dval('in-rate',K.interest?.rate||0)),period:dval('in-per',K.interest?.period||'month')})){clear('in-rate','in-per');render();toast('Interest saved.')}return}
    if(kind==='kidpin'||kind==='parentpin'){const inp=f.querySelector('input');const pin=inp.value.trim();if(!/^\d{4,8}$/.test(pin)){toast('Use 4 to 8 digits.');return}
      if(await act(kind==='kidpin'?{action:'setKidPin',kid:fd.kid,pin}:{action:'setParentPin',pin}))toast('PIN saved.');return}
    if(kind==='kid'){const name=(drafts['k-new']||'').trim();if(!name)return;if(await act({action:'addKid',name})){clear('k-new');render();toast(`${name} added with starter chores. Set a PIN next.`)}return}
    if(kind==='lookup'){const s=(drafts['lk']||'').trim().toUpperCase();if(!s)return;ui.sym=s;clear('lk');render();loadPrices([s]);return}
    if(kind==='buy'){const amt=num(drafts['tr-amt']);if(!(amt>0)){toast('Enter a practice amount.');return}
      if(await act({action:'buy',kid:fd.kid,symbol:fd.sym,amount:amt})){clear('tr-amt');render();toast(`Practice bought ${money(amt)} of ${fd.sym}.`)}return}
    if(kind==='request'){const amt=num(drafts['rq-amt']);if(!(amt>0)){toast('Enter how much real money.');return}
      const c=catOf(fd.sym);if(await act({action:'request',kid:fd.kid,symbol:fd.sym,name:c?c[2]:(PX[fd.sym]?.name||''),amount:amt,note:drafts['rq-note']||''})){clear('rq-amt','rq-note');render();toast('Request sent to your parent.')}return}
    if(kind==='grant'){const amt=num(drafts['gr-amt']);if(!(amt>0)){toast('Enter an amount.');return}if(await act({action:'grantPractice',kid:fd.kid,amount:amt})){clear('gr-amt');render();toast('Practice money added.')}return}
    if(kind==='answer'){const status=e.submitter?.dataset.status||'done';if(await act({action:'answerRequest',id:fd.id,status,reply:drafts['ra-'+fd.id]||''})){clear('ra-'+fd.id);render()}return}
    if(kind==='reading'){const title=(drafts['rd-title']||'').trim();if(!title){toast('Type the book title.');return}
      if(await act({action:'addReading',kid:fd.kid,title,minutes:num(drafts['rd-min']),pages:num(drafts['rd-pages']),date:drafts['rd-date']||S.today,finished:drafts['rd-fin']==='1'})){clear('rd-title','rd-min','rd-pages','rd-fin');render();toast('Reading saved.')}return}
    if(kind==='grade'){const subject=(drafts['gd-sub']||'').trim(),grade=(drafts['gd-grade']||'').trim();if(!subject||!grade){toast('Add the class and the grade.');return}
      if(await act({action:'addGrade',kid:fd.kid,subject,grade,kind:drafts['gd-kind']||'Test',note:drafts['gd-note']||'',date:drafts['gd-date']||S.today})){clear('gd-sub','gd-grade','gd-note');render();toast('Grade shared.')}return}
    if(kind==='gcomment'){if(await act({action:'commentGrade',kid:fd.kid,id:fd.id,comment:drafts['gc-'+fd.id]??undefined})){clear('gc-'+fd.id);render()}return}
  }catch(err){toast(err.message)}
});

/* ---------- boot + refresh ---------- */
async function boot(){
  if(token){try{const d=await call({action:'state'});setState(d.state);return}catch(e){}}
  try{hello=await call({action:'hello',code:famCode||''},false)}catch(e){hello={error:e.message}}
  render();
}
async function refresh(){
  if(!S||!token||ui.busy||document.hidden)return;
  const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;
  try{const d=await call({action:'state'});S=d.state;render()}catch(e){}
}
setInterval(refresh,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
boot();
})();
</script>
</body>
</html>
